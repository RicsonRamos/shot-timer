plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ramos.shottimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ramos.shottimer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('keystore/release.jks')
            storePassword 'shottimer123'
            keyAlias 'shottimer'
            keyPassword 'shottimer123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
